[package]
name = "vmod_memstore"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Varnish VMOD providing CIDR sets, key/value stores and regex sets loaded from files"
license = "BSD-3-Clause"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
varnish = "0.7.2"
arc-swap = "1.7"
regex = "1.13"
thiserror = "2.0"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "cidr"
harness = false

[[bench]]
name = "kv"
harness = false

[[bench]]
name = "pattern"
harness = false

[profile.release]
lto = true
codegen-units = 1
